[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predlab"
version = "0.1.0"
description = "Prediction-market forecasting research and PAPER-TRADING simulator. No real-money execution."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "pydantic>=2",
  "pydantic-settings>=2",
  "structlog>=24",
  "typer>=0.12",
  "numpy>=1.26",
  "pandas>=2.1",
]

[project.optional-dependencies]
models = ["scikit-learn>=1.4", "lightgbm>=4", "scipy>=1.11", "statsmodels>=0.14"]
dashboard = ["streamlit>=1.35", "plotly>=5.20"]
reports = ["jinja2>=3.1"]
llm = ["anthropic>=0.40"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "hypothesis>=6", "ruff>=0.5"]

[project.scripts]
predlab = "predlab.cli:app"

[tool.setuptools.packages.find]
include = ["predlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits real public read-only endpoints (opt-in: pytest -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"predlab/cli.py" = ["B008"]  # typer.Option in defaults is typer's documented idiom
